<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
  <div class="logo">MyTube</div>
  <input type="text" placeholder="Search" class="search-bar">
  <button class="search-btn">🔍</button>
  <button class="upload-btn">⬆ Upload</button>
</header>


  <!-- Sidebar -->
  <aside class="sidebar">
    <ul>
      <li>🏠 Home</li>
      <li>🔥 Trending</li>
      <li>🎵 Music</li>
      <li>🎮 Gaming</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="video-grid">
      <div class="video-card">
        <img src="https://via.placeholder.com/300x180" alt="Video thumbnail">
        <h3>Sample Video Title</h3>
        <p>Channel Name • 1M views</p>
      </div>
      <div class="video-card">
        <img src="https://via.placeholder.com/300x180" alt="Video thumbnail">
        <h3>Another Video</h3>
        <p>Channel Name • 500K views</p>
      </div>
      <!-- Add more video cards -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 MyTube Clone</p>
  </footer>
</body>
</html>
